# Cloud Build + Cloud Run Deployment Pipeline
#
# Builds a container image, pushes to Artifact Registry, and deploys to Cloud Run.
# Triggered from Cloud Build via:
#   gcloud builds submit --config=cloudbuild-cloudrun-deploy.yaml .
#
# Or connected to a GitHub repo via Cloud Build triggers.
#
# VARIABLES (set as Cloud Build substitutions or replace inline):
#   _PROJECT_ID          = GCP project ID
#   _REGION              = deployment region
#   _SERVICE_NAME        = Cloud Run service name
#   _REPO                = Artifact Registry repository name
#   _SERVICE_ACCOUNT     = Cloud Run runtime service account email

substitutions:
  _PROJECT_ID: your-project-id
  _REGION: us-central1
  _SERVICE_NAME: my-service
  _REPO: containers
  _SERVICE_ACCOUNT: my-service-sa@your-project-id.iam.gserviceaccount.com

steps:
  # ─── 1. Build Container Image ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - --tag
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest
      - --cache-from
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - .

  # ─── 2. Push to Artifact Registry ─────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}

  # ─── 3. Run Tests (optional — add your test command) ──────────────────────
  # - name: ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
  #   id: test
  #   entrypoint: /bin/sh
  #   args: ["-c", "go test ./... -race -timeout=120s"]

  # ─── 4. Deploy to Cloud Run ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
      - --region=${_REGION}
      - --project=${_PROJECT_ID}
      - --service-account=${_SERVICE_ACCOUNT}
      - --min-instances=1
      - --max-instances=100
      - --concurrency=80
      - --cpu=1
      - --memory=512Mi
      - --timeout=300s
      - --no-allow-unauthenticated
      - --no-traffic  # Deploy without routing traffic (use traffic split for canary)

  # ─── 5. Smoke Test New Revision ───────────────────────────────────────────
  # - name: curlimages/curl
  #   id: smoke-test
  #   entrypoint: /bin/sh
  #   args:
  #     - "-c"
  #     - |
  #       REVISION=$(gcloud run revisions list --service=${_SERVICE_NAME} --region=${_REGION} \
  #         --sort-by=~createTime --limit=1 --format="value(metadata.name)")
  #       # Tag the revision for direct access
  #       gcloud run services update-traffic ${_SERVICE_NAME} --region=${_REGION} \
  #         --set-tags=canary=$REVISION
  #       # Test the tagged revision
  #       curl -sf -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
  #         https://canary---${_SERVICE_NAME}-HASH-uc.a.run.app/livez

  # ─── 6. Promote Traffic ───────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: promote
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE_NAME}
      - --region=${_REGION}
      - --project=${_PROJECT_ID}
      - --to-latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

# Artifacts: store the image digest for traceability
images:
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest

# IAM required for Cloud Build service account:
#   roles/run.developer
#   roles/artifactregistry.writer
#   roles/iam.serviceAccountUser (to act as the Cloud Run runtime SA)
