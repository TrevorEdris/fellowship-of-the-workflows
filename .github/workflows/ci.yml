name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check plugin version bump
        run: ./bin/check-version "${{ github.event.pull_request.base.sha }}"

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CLI
        run: |
          python -m venv cli/.venv
          cli/.venv/bin/pip install -e "cli/[dev]"

      - name: Validate workflows
        run: ./bin/fotw validate

      - name: Run tests
        run: ./bin/test -v
