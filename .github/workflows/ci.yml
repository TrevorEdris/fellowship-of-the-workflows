name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check plugin version bump
        run: ./bin/check-version "${{ github.event.pull_request.base.sha }}"

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CLI
        run: |
          python -m venv cli/.venv
          cli/.venv/bin/pip install -e "cli/[dev]"

      - name: Validate workflows
        run: ./bin/fotw validate

      - name: Run tests
        run: ./bin/test -v

      - name: Run eval (deterministic)
        id: eval
        run: |
          set +e
          OUTPUT=$(./bin/fotw eval --all 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          exit $EXIT_CODE

      - name: Comment eval failures on PR
        if: steps.eval.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## ❌ Eval Failures\n\nDeterministic eval tests failed. See the [workflow run](' +
                `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` +
                ') for details.\n\nRun locally: `./bin/fotw eval --all`',
            });
