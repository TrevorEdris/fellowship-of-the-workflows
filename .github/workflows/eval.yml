name: Weekly Eval

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 4am UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CLI
        run: |
          python -m venv cli/.venv
          cli/.venv/bin/pip install -e "cli/[dev]"

      - name: Run eval (deterministic)
        id: eval
        run: |
          set +e
          OUTPUT=$(./bin/fotw eval --all --output eval-results.json 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Build summary for issue body
          PASSED=$(echo "$OUTPUT" | grep -c '✓ passed')
          FAILED=$(echo "$OUTPUT" | grep -c '✗ failed')
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Create or update eval issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = parseInt('${{ steps.eval.outputs.passed }}') || 0;
            const failed = parseInt('${{ steps.eval.outputs.failed }}') || 0;
            const total = parseInt('${{ steps.eval.outputs.total }}') || 0;
            const exitCode = parseInt('${{ steps.eval.outputs.exit_code }}') || 0;
            const date = new Date().toISOString().split('T')[0];

            const status = exitCode === 0 ? '✅ All Passing' : '❌ Failures Detected';
            const title = `Eval Report ${date}: ${status}`;

            let body = `## Weekly Eval Report — ${date}\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Total assertions | ${total} |\n`;
            body += `| Passed | ${passed} |\n`;
            body += `| Failed | ${failed} |\n\n`;

            if (exitCode !== 0) {
              body += `### Failed Tests\n\nSee the [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.\n\n`;
            }

            body += `---\n*Generated by [Weekly Eval](.github/workflows/eval.yml)*`;

            // Find existing open eval-report issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'eval-report',
              state: 'open',
              per_page: 1,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['eval-report', 'automated'],
              });
            }
