name: Weekly Eval

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 4am UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CLI
        run: |
          python -m venv cli/.venv
          cli/.venv/bin/pip install -e "cli/[dev]"

      - name: Run eval (deterministic)
        id: eval
        run: |
          set +e
          ./bin/fotw eval --all --output eval-results.json 2>&1 | tee eval-output.txt
          EVAL_EXIT=${PIPESTATUS[0]}
          echo "eval_failed=$( [ $EVAL_EXIT -ne 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

          PASSED=$(grep -c '✓ passed' eval-output.txt || true)
          FAILED=$(grep -c '✗ failed' eval-output.txt || true)
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Create or update eval issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = parseInt('${{ steps.eval.outputs.passed }}') || 0;
            const failed = parseInt('${{ steps.eval.outputs.failed }}') || 0;
            const total = parseInt('${{ steps.eval.outputs.total }}') || 0;
            const evalFailed = '${{ steps.eval.outputs.eval_failed }}' === 'true';
            const date = new Date().toISOString().split('T')[0];

            const status = evalFailed ? '❌ Failures Detected' : '✅ All Passing';
            const title = `Eval Report ${date}: ${status}`;

            let body = `## Weekly Eval Report — ${date}\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Total assertions | ${total} |\n`;
            body += `| Passed | ${passed} |\n`;
            body += `| Failed | ${failed} |\n\n`;

            if (evalFailed) {
              const fs = require('fs');
              const output = fs.readFileSync('eval-output.txt', 'utf8');
              body += `### Eval Output\n\n\`\`\`\n${output}\n\`\`\`\n\n`;
            }

            body += `---\n*Generated by [Weekly Eval](.github/workflows/eval.yml)*`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'eval-report',
              state: 'open',
              per_page: 1,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['eval-report', 'automated'],
              });
            }

      - name: Setup improvement branch
        if: steps.eval.outputs.eval_failed == 'true'
        run: |
          source .github/scripts/manage-improvement-pr.sh
          setup_branch

      - name: Analyze failures with Claude
        if: steps.eval.outputs.eval_failed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read the prompt in .github/prompts/analyze-eval-failures.md and follow its instructions.
            The eval output is in eval-output.txt and eval-results.json.
            Today's date is $(date +%Y-%m-%d).

            After making changes, commit them with conventional commit messages.
          claude_args: '--allowedTools "Read,Write,Edit,Bash,Glob,Grep" --max-turns 25 --model sonnet'

      - name: Push and create PR
        if: always() && steps.eval.outputs.eval_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if Claude made any changes
          if git diff --quiet origin/main..HEAD 2>/dev/null && git diff --quiet; then
            echo "No changes to push"
            exit 0
          fi

          # Commit any unstaged changes Claude left
          git add -A
          git diff --cached --quiet || git commit -m "fix(skills): automated eval regression fixes"

          source .github/scripts/manage-improvement-pr.sh
          DATE=$(date +%Y-%m-%d)
          CHANGES=$(git log --oneline origin/main..HEAD | sed 's/^/- /')
          push_and_pr "Weekly Eval" "$DATE" "$CHANGES"

      - name: Check for stale improvement PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/manage-improvement-pr.sh
          check_staleness 30
